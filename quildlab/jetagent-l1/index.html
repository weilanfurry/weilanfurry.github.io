<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>JetAgent</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <span class="material-symbols-outlined">bolt</span>
      </div>
      <div class="brand-name">JetAgent</div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <span class="material-symbols-outlined">add</span>
      <span class="btn-label">新对话</span>
    </button>

    <div class="conversation-list" id="conversationList"></div>

    <div class="sidebar-footer">
      <button class="settings-btn" id="openSettingsBtn" aria-label="打开设置">
        <span class="material-symbols-outlined">settings</span>
        <span class="btn-label">设置</span>
      </button>
    </div>
  </aside>

  <main class="chat-panel">
    <header class="chat-topbar">
      <div>
        <h1 id="activeChatTitle">新对话</h1>
        <p><span class="dot" id="statusDot"></span><span id="statusText">就绪</span></p>
      </div>
      <button class="icon-btn" id="clearChatBtn" aria-label="清空当前对话" title="清空当前对话">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </header>

    <section class="chat-box" id="chatBox">
      <div class="chat-empty">
        <span class="material-symbols-outlined">forum</span>
        <span>输入问题开始对话</span>
      </div>
    </section>

    <footer class="composer">
      <textarea id="userInput" placeholder="输入问题，Ctrl+Enter 发送" rows="2"></textarea>
      <button class="send-btn" id="sendChatBtn" aria-label="发送">
        <span class="material-symbols-outlined">send</span>
      </button>
    </footer>
  </main>
</div>

<div class="modal-backdrop" id="settingsModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-header">
      <div>
        <h2 id="settingsTitle">API 配置</h2>
        <p>配置会保存在当前浏览器</p>
      </div>
      <button class="icon-btn" id="closeSettingsBtn" aria-label="关闭设置">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="config-grid">
      <div class="config-item">
        <label for="baseUrl"><span class="material-symbols-outlined">link</span>接口地址</label>
        <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1/chat/completions" />
      </div>
      <div class="config-item">
        <label for="apiKey"><span class="material-symbols-outlined">key</span>API Key</label>
        <input type="text" id="apiKey" placeholder="sk- 你的密钥" />
      </div>
      <div class="config-item">
        <label for="modelName"><span class="material-symbols-outlined">smart_toy</span>模型名称</label>
        <input type="text" id="modelName" placeholder="deepseek-chat" />
      </div>
    </div>

    <div class="modal-meta">
      <span>Worker: <code id="workerDisplay">加载中...</code></span>
      <span>密钥仅保存在浏览器</span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
      <button class="btn btn-primary" id="saveConfigBtn">
        <span class="material-symbols-outlined">save</span>
        保存
      </button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
